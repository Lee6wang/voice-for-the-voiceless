<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>无声之声 · glasses-app</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #101410;
        color: #d7e8d7;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 17px;
        line-height: 1.6;
      }
      .view { display: none; padding: 20px 16px 32px; max-width: 560px; margin: 0 auto; }
      .view.active { display: block; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: #8fae8f; font-size: 14px; margin: 0 0 16px; }
      .chip {
        display: inline-block; padding: 4px 12px; border-radius: 999px;
        background: #1d2a1d; color: #7ce87c; font-size: 14px; margin-bottom: 12px;
      }
      .card {
        background: #182018; border: 1px solid #2a3a2a; border-radius: 12px;
        padding: 14px; margin-bottom: 14px;
      }
      .card h2 { font-size: 15px; color: #8fae8f; margin: 0 0 8px; font-weight: 600; }
      #hud {
        white-space: pre-wrap; font-family: ui-monospace, monospace;
        color: #7ce87c; min-height: 96px; font-size: 15px;
      }
      .feature {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 0; border-bottom: 1px solid #223022; font-size: 15px;
      }
      .feature:last-child { border-bottom: none; }
      .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
      .tag.on { background: #1d3a1d; color: #7ce87c; }
      .tag.soon { background: #2a2a1d; color: #b8b87c; }
      button {
        width: 100%; padding: 13px; border: none; border-radius: 10px;
        background: #2f6b2f; color: #eaffea; font-size: 17px; margin-top: 8px;
      }
      button.ghost { background: #223022; color: #bfe8bf; }
      label { display: block; margin: 14px 0 6px; color: #a8c8a8; font-size: 14px; }
      input[type='text'], textarea {
        width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #2a3a2a;
        background: #0e130e; color: #d7e8d7; font-size: 16px;
      }
      textarea { min-height: 96px; resize: vertical; }
      .tones { display: flex; gap: 8px; }
      .tones label {
        flex: 1; margin: 0; text-align: center; padding: 10px 0;
        border: 1px solid #2a3a2a; border-radius: 10px;
        background: #0e130e; color: #d7e8d7; font-size: 15px;
      }
      .tones input { display: none; }
      .tones label:has(input:checked) { background: #2f6b2f; color: #eaffea; border-color: #2f6b2f; }
      .quick-btn {
        display: block; width: 100%; text-align: left; background: #223022;
        color: #d7e8d7; margin-top: 8px; padding: 12px; font-size: 16px;
      }
      .guide-row { display: flex; gap: 10px; padding: 5px 0; font-size: 15px; }
      .guide-key { color: #7ce87c; white-space: nowrap; min-width: 7.5em; }
      .check { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; color: #d7e8d7; font-size: 15px; }
      .check input { width: 20px; height: 20px; accent-color: #2f6b2f; }
      .scene-row { display: flex; gap: 8px; }
      .scene-chip {
        flex: 1; width: auto; margin-top: 0; padding: 10px 0; font-size: 15px;
        background: #0e130e; border: 1px solid #2a3a2a; color: #d7e8d7; border-radius: 10px;
      }
      .scene-chip.active { background: #2f6b2f; color: #eaffea; border-color: #2f6b2f; }
      #emergency-overlay {
        position: fixed; inset: 0; z-index: 99; background: #c62828; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; text-align: center; padding: 24px;
      }
      #emergency-overlay[hidden] { display: none; }
      .em-icon { font-size: 64px; animation: pulse 0.8s infinite; }
      .em-text { font-size: 28px; font-weight: 700; }
      .em-hint { font-size: 14px; opacity: 0.85; }
      @keyframes pulse { 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <!-- 菜单页 -->
    <main id="view-menu" class="view active">
      <h1>无声之声</h1>
      <p class="sub">帮你把话说出口的社交表达搭子</p>
      <span class="chip" id="status">待机</span>

      <!-- 场景预设：影响候选生成与快捷句（一键切换，存设置） -->
      <section class="card">
        <h2>场景（影响候选与快捷句）</h2>
        <div class="scene-row">
          <button class="scene-chip active" data-scene="default">通用</button>
          <button class="scene-chip" data-scene="work">工作</button>
          <button class="scene-chip" data-scene="dining">点餐</button>
          <button class="scene-chip" data-scene="social">聚会</button>
        </div>
      </section>

      <!-- 30 秒上手（首启显示，看过不再弹） -->
      <section class="card" id="onboard" hidden>
        <h2>30 秒上手</h2>
        <div class="guide-row"><span class="guide-key">轻点戒指</span><span>开始听对方说话</span></div>
        <div class="guide-row"><span class="guide-key">上下滑动</span><span>在候选里挑一句</span></div>
        <div class="guide-row"><span class="guide-key">再轻点</span><span>替你说出口</span></div>
        <div class="guide-row"><span class="guide-key">双击戒指</span><span>换一批候选</span></div>
        <div class="guide-row"><span class="guide-key">双击镜腿</span><span>紧急呼救</span></div>
        <button id="btn-onboard-ok">知道了</button>
      </section>

      <section class="card">
        <h2>眼镜画面（实时镜像）</h2>
        <div id="hud"></div>
      </section>

      <!-- 快捷句发声板：点按即说，眼镜没电/未戴时手机独立可用 -->
      <section class="card" id="quick-card" hidden>
        <h2>快捷句（点按即说）</h2>
        <div id="quick-list"></div>
      </section>

      <section class="card">
        <h2>功能</h2>
        <div class="feature"><span>应答模式 · 轻点戒指开始聆听</span><span class="tag on">可用</span></div>
        <div class="feature"><span>紧急呼救 · 镜腿双击</span><span class="tag on">可用</span></div>
        <div class="feature"><span>主动模式 · 常用意图轮盘</span><span class="tag soon">即将上线</span></div>
      </section>

      <button id="btn-config">个性化配置</button>
    </main>

    <!-- 配置页 -->
    <main id="view-config" class="view">
      <h1>个性化配置</h1>
      <p class="sub">让候选更像你自己说话；保存后立即生效</p>

      <label for="f-name">名字（自我介绍用）</label>
      <input type="text" id="f-name" placeholder="例如：小李" />

      <label for="f-phrases">常用语（每行一条，喂给候选生成）</label>
      <textarea id="f-phrases" placeholder="我在忙，稍后回复你&#10;帮我带一杯冰美式"></textarea>

      <label>语气</label>
      <div class="tones">
        <label><input type="radio" name="f-tone" value="gentle" /><span>温和</span></label>
        <label><input type="radio" name="f-tone" value="plain" checked /><span>平实</span></label>
        <label><input type="radio" name="f-tone" value="humor" /><span>幽默</span></label>
      </div>

      <label for="f-emergency">紧急呼救语（镜腿双击时朗读）</label>
      <input type="text" id="f-emergency" placeholder="请帮帮我" />

      <label for="f-voice">音色 ID（选填，留空用默认）</label>
      <input type="text" id="f-voice" placeholder="default" />

      <label>操作偏好</label>
      <label class="check">
        <input type="checkbox" id="f-twostep" checked />
        <span>两步确认：候选选中后再点一下才说出（防误触）</span>
      </label>
      <label class="check">
        <input type="checkbox" id="f-offline" />
        <span>纯离线模式：不联网，候选用内置短语、发声用本机语音（隐私/无网可用）</span>
      </label>
      <label class="check">
        <input type="checkbox" id="f-mirror" />
        <span>手机镜像眼镜画面（默认关保隐私，演示时打开）</span>
      </label>

      <label>聆听时长</label>
      <div class="tones">
        <label><input type="radio" name="f-listen" value="3" /><span>3 秒</span></label>
        <label><input type="radio" name="f-listen" value="4" checked /><span>4 秒</span></label>
        <label><input type="radio" name="f-listen" value="5" /><span>5 秒</span></label>
      </div>

      <button id="btn-save">保存</button>
      <button id="btn-back" class="ghost">返回</button>
      <p id="save-msg" class="sub" style="min-height: 1.4em"></p>
    </main>

    <!-- 紧急呼救全屏警示（手机有彩色；点按任意处解除） -->
    <div id="emergency-overlay" hidden>
      <div class="em-icon">⚠️</div>
      <div class="em-text" id="em-text"></div>
      <div class="em-hint">点按任意位置解除</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
